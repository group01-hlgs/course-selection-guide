<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <rect x="4" y="4" width="1192" height="272" rx="18" fill="#F4F4F5" stroke="#A1A1AA" stroke-width="2"/>
  <text x="600" y="38" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="19" font-weight="900" fill="#111827">
    花女三年課程架構與選課分流全覽（總修習 182 學分 ＝ 必修+選修 182 學分 ＋ 團體活動 16~17 節 ＋ 彈性學習 11~12 節）
  </text>

  <g transform="translate(24, 58)">
    <rect x="0" y="0" width="368" height="196" rx="14" fill="#EAEAEB" stroke="#111827" stroke-width="2"/>
    <rect x="14" y="14" width="340" height="32" rx="8" fill="#111827"/>
    <text x="184" y="35" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14.5" font-weight="800" fill="#FFFFFF">高一（115 入學）：統整試探 ‧ 不分班群</text>
    <text x="16" y="68" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#111827">• 每學期固定 31 學分（部定必修 29 ＋ 多元選修 2）</text>
    <text x="16" y="92" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="600" fill="#111827">• 本土語/手語：一上 1 ＋ 一下 1 學分（115 新制）</text>
    <text x="16" y="116" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="600" fill="#111827">• 學期對開：物理/生物、美術/資科、化學/探究B</text>
    <text x="16" y="140" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="600" fill="#111827">• 彈性學習：每週五第 3-4 節（2 節/週，自主學習）</text>
    <text x="16" y="164" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#111827">• 關鍵決策：5 月中旬選組（自然A/社會B）與數A/B</text>
  </g>

  <path d="M 396 156 L 412 156" stroke="#52525B" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(416, 58)">
    <rect x="0" y="0" width="368" height="196" rx="14" fill="#EFEFF1" stroke="#27272A" stroke-width="2"/>
    <rect x="14" y="14" width="340" height="32" rx="8" fill="#27272A"/>
    <text x="184" y="35" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14.5" font-weight="800" fill="#FFFFFF">高二（114 入學）：自然A / 社會B 適性分流</text>
    <text x="16" y="68" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#27272A">• 校訂必修 4 學分：洄瀾之欣(2)、職業探究(2)對開</text>
    <text x="16" y="92" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="600" fill="#111827">• 自然組(A)：數A(8) ‧ 選化(4)/選物(2)/選生(2)/選地(2)</text>
    <text x="16" y="116" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="600" fill="#111827">• 社會組(B)：數B或數A(8) ‧ 先修家政(2) ‧ 歷地公探究</text>
    <text x="16" y="140" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="600" fill="#111827">• 特殊對開：A組公民/選生對開；B組地理/探究對開</text>
    <text x="16" y="164" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#27272A">• 關鍵決策：5 月高三加深加廣選課 ＆ 轉組申請</text>
  </g>

  <path d="M 788 156 L 804 156" stroke="#52525B" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(808, 58)">
    <rect x="0" y="0" width="368" height="196" rx="14" fill="#E4E4E7" stroke="#3F3F46" stroke-width="2"/>
    <rect x="14" y="14" width="340" height="32" rx="8" fill="#3F3F46"/>
    <text x="184" y="35" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14.5" font-weight="800" fill="#FFFFFF">高三（113 入學）：加深加廣 ‧ 升學衝刺</text>
    <text x="16" y="68" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#3F3F46">• 高三下無部定國英，全轉為加深加廣與多元選修</text>
    <text x="16" y="92" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="600" fill="#111827">• 自然組(A)：數甲(8)、選物(8)、選化(6)、選生(6)、工設(2)</text>
    <text x="16" y="116" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="600" fill="#111827">• 社會組(B)：數乙(8)、選歷/地/公(各6)、健休(2)+補強</text>
    <text x="16" y="140" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="600" fill="#111827">• 多元選修：每週四下午 25 門跨班選修（上2+下2）</text>
    <text x="16" y="164" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#3F3F46">• 畢業門檻：總及格 ≥ 150（普通必修≥102、選修≥40）</text>
  </g>
</svg>
