<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_mono_True" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="pillGrad_mono_True" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.14"/>
    </filter>
    <pattern id="archGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#111827" stroke-width="0.6" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Main Architectural Frame -->
  <rect x="8" y="8" width="1184" height="364" rx="22" fill="url(#bgGrad_mono_True)" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="8" y="8" width="1184" height="364" rx="22" fill="url(#archGrid)"/>

  <!-- Subtle Horizon Wave at Bottom -->
  <path d="M 8 316 Q 220 290 440 318 T 880 308 L 1192 320 L 1192 350 Q 1192 372 1170 372 L 30 372 Q 8 372 8 350 Z" fill="#111827" opacity="0.10"/>
  <path d="M 8 334 Q 280 310 540 334 T 1020 326 L 1192 338 L 1192 350 Q 1192 372 1170 372 L 30 372 Q 8 372 8 350 Z" fill="#374151" opacity="0.14"/>

  <!-- Geometric Editorial Accents -->
  <circle cx="1115" cy="78" r="46" fill="none" stroke="#374151" stroke-width="1.5" opacity="0.25" stroke-dasharray="6,4"/>
  <circle cx="1115" cy="78" r="28" fill="#2563EB" opacity="0.12"/>

  <!-- Left Editorial Content Card -->
  <g filter="url(#softShadow)">
    <rect x="46" y="36" width="768" height="308" rx="18" fill="#1F2937" stroke="#D1D5DB" stroke-width="1.8"/>
    <rect x="46" y="36" width="8" height="308" rx="4" fill="#111827"/>
  </g>

  <!-- Theme Pill Tag -->
  <rect x="82" y="62" width="365" height="34" rx="8" fill="url(#pillGrad_mono_True)"/>
  <text x="100" y="84" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">
    國立花蓮女子高級中學 ‧ ⚡ 極簡黑白モノ (Mono Studio)
  </text>

  <!-- Year Badge -->
  <rect x="460" y="62" width="188" height="34" rx="8" fill="#E5E7EB" stroke="#111827" stroke-width="1.5"/>
  <text x="554" y="84" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="13.5" font-weight="800" fill="#111827">
    115 學年度最新完整版
  </text>

  <!-- Main Title -->
  <text x="82" y="148" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="40" font-weight="900" fill="#F9FAFB" letter-spacing="1">
    國立花蓮女中 ‧ 選課輔導手冊
  </text>
  <text x="82" y="182" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="16.5" font-weight="600" fill="#9CA3AF">
    Course Selection &amp; Career Planning Guide — 卓越 ‧ 突破 ‧ 多元 ‧ 三品
  </text>

  <!-- 3 Grade Highlight Cards inside Banner -->
  <g transform="translate(82, 204)">
    <rect x="0" y="0" width="224" height="58" rx="10" fill="#090D16" stroke="#111827" stroke-width="1.5"/>
    <text x="14" y="24" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="800" fill="#111827">🎒 115 入學高一（現高一）</text>
    <text x="14" y="45" font-family="'Noto Sans TC', sans-serif" font-size="12.5" font-weight="600" fill="#F9FAFB">本土語 1+1 ‧ 彈性每週 2 節 ‧ 31 學分</text>

    <rect x="238" y="0" width="224" height="58" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="252" y="24" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="800" fill="#F9FAFB">🧭 114 入學高二（現高二）</text>
    <text x="252" y="45" font-family="'Noto Sans TC', sans-serif" font-size="12.5" font-weight="600" fill="#F9FAFB">自然 A / 社會 B 分流 ‧ 校訂必修對開</text>

    <rect x="476" y="0" width="224" height="58" rx="10" fill="#1F2937" stroke="#2563EB" stroke-width="1.5"/>
    <text x="490" y="24" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="800" fill="#F9FAFB">🎓 113 入學高三（現高三）</text>
    <text x="490" y="45" font-family="'Noto Sans TC', sans-serif" font-size="12.5" font-weight="600" fill="#F9FAFB">加深加廣衝刺 ‧ 25 門多元 ‧ 150 學分</text>
  </g>

  <!-- Bottom Meta Note -->
  <text x="82" y="318" font-family="'Noto Sans TC', sans-serif" font-size="13.5" font-weight="600" fill="#9CA3AF">
    📍 整合 113（高三）、114（高二）、115（高一）三份報部課程計畫書 ‧ 教務處教學組 × 課程諮詢團隊編製
  </text>

  <!-- Right Editorial Atlas Card -->
  <g transform="translate(844, 36)" filter="url(#softShadow)">
    <rect x="0" y="0" width="308" height="308" rx="18" fill="#1F2937" stroke="#D1D5DB" stroke-width="1.8"/>
    <rect x="18" y="18" width="272" height="192" rx="12" fill="url(#bgGrad_mono_True)" stroke="#D1D5DB" stroke-width="1"/>
    
    <!-- Modern Mountain, Pacific Horizon & Compass Vector -->
    <circle cx="236" cy="60" r="22" fill="#2563EB" opacity="0.28"/>
    <!-- Qilai & Central Range Silhouette -->
    <path d="M 18 172 L 82 104 L 138 148 L 198 88 L 254 138 L 290 116 L 290 172 Z" fill="#374151" opacity="0.26"/>
    <!-- Pacific Horizon Waves -->
    <path d="M 18 172 Q 86 156 154 172 T 290 168 L 290 210 L 18 210 Z" fill="#111827" opacity="0.32"/>

    <!-- Minimalist Course Atlas Grid Card -->
    <rect x="74" y="54" width="160" height="106" rx="8" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
    <rect x="74" y="54" width="160" height="24" rx="8" fill="#111827"/>
    <circle cx="88" cy="66" r="3.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="100" cy="66" r="3.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="112" cy="66" r="3.5" fill="#FFFFFF" opacity="0.8"/>
    <text x="190" y="70" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF">HLGS // 115</text>
    <line x1="154" y1="78" x2="154" y2="160" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="88" y1="96" x2="140" y2="96" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <line x1="88" y1="114" x2="132" y2="114" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
    <line x1="88" y1="132" x2="124" y2="132" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
    <line x1="168" y1="96" x2="218" y2="96" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <line x1="168" y1="114" x2="212" y2="114" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
    <line x1="168" y1="132" x2="204" y2="132" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>

    <!-- Caption -->
    <text x="154" y="242" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="15.5" font-weight="800" fill="#F9FAFB">
      建築感純粹黑白 × 高對比現代資訊設計
    </text>
    <rect x="44" y="258" width="220" height="30" rx="8" fill="#E5E7EB"/>
    <text x="154" y="278" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12.5" font-weight="800" fill="#111827">
      HLGS ‧ 1927 創校 ‧ 洄瀾山海學府
    </text>
  </g>
</svg>