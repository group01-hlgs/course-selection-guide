    <text x="131" y="140" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12.5" fill="#b8a686">古籍羅盤總徽章・三屆速查雷達</text>
    <text x="131" y="168" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#8c734b">113高三 / 114高二 / 115高一</text>
  </g>

  <!-- Card 2: Vol 1 關於花女 -->
  <g transform="translate(324, 84)">
