<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 295" width="100%" height="100%">
  <rect x="4" y="4" width="1192" height="287" rx="16" fill="#FFFDF9" stroke="#B45309" stroke-width="2"/>
  <rect x="28" y="18" width="460" height="34" rx="8" fill="#B45309"/>
  <circle cx="48" cy="35" r="5" fill="#FFFFFF"/>
  <text x="62" y="40" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="15.5" font-weight="800" fill="#FFFFFF">高二專區（114 學年度入學高二適用）</text>
  <rect x="28" y="58" width="1144" height="36" rx="8" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="44" cy="76" r="4.5" fill="#B45309"/>
  <text x="58" y="81" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12.4" font-weight="600" fill="#292524">【校訂必修對開】普通班高二上、下學期由《洄瀾之欣》(2) 與《職業探究與報導》(2) 兩門課對開共 4 學分！（修正舊手冊僅列洄瀾之欣之遺漏）</text>
  <rect x="28" y="102" width="1144" height="36" rx="8" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="44" cy="120" r="4.5" fill="#B45309"/>
  <text x="58" y="125" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12.0" font-weight="600" fill="#292524">【自然組（班群A）】高二上修《選修化學-物質與能量》(2)，且部定必修《公民與社會》(2) 與加深加廣《選修生物-動物體的構造與功能》(2) 上下學期對開！高二下修 8 學分加深加廣。</text>
  <rect x="28" y="146" width="1144" height="36" rx="8" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="44" cy="164" r="4.5" fill="#B45309"/>
  <text x="58" y="169" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12.0" font-weight="600" fill="#292524">【社會組（班群B）】高二上先修畢綜合領域必修《家政》(2)（自然組高三才修家政，轉組生務必注意家政學分落差！），《地理》(2) 與《探究與實作：地理與人文社會科學研究》(2) 對開。</text>
  <rect x="28" y="190" width="1144" height="36" rx="8" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="44" cy="208" r="4.5" fill="#B45309"/>
  <text x="58" y="213" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12.4" font-weight="600" fill="#292524">【數理資優班變動】114/115 入學數資班改為高一《研究方法》4 學分、高二《獨立研究》6 學分（3+3），且必修《資訊科技》(1+1) 移至高二修習。</text>
  <rect x="28" y="234" width="1144" height="36" rx="8" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="44" cy="252" r="4.5" fill="#B45309"/>
  <text x="58" y="257" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12.4" font-weight="600" fill="#292524">【未來學期預告】高三下無部定必修國文與英文（全數轉為加深加廣選修），高三選修高達 19～26 學分，直接銜接分科測驗與大學申請。</text>
</svg>
